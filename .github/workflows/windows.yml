name: Windows
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          architecture: x64
          cache: pip
      - run: python -m venv .venv
      - run: .venv\Scripts\python.exe -m pip install -r requirements-dev.txt
      - name: Match release tag to app version
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $version = (.venv\Scripts\python.exe -c 'from app_info import VERSION; print(VERSION)').Trim()
          if ($env:GITHUB_REF_NAME -ne "v$version") { throw "Tag and app version do not match" }
      - name: Check and package
        shell: pwsh
        run: ./scripts/build.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: TrainerRelay-windows-x64
          path: |
            release/*.zip
            release/SHA256SUMS.txt
  publish:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: TrainerRelay-windows-x64
          path: release
      - name: Publish prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" release/*.zip release/SHA256SUMS.txt --prerelease --title "TrainerRelay $GITHUB_REF_NAME" --notes-file CHANGELOG.md --verify-tag
