name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  release:
    permissions:
      contents: write
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          architecture: x64
          cache: pip
      - run: python -m venv .venv
      - run: .venv\Scripts\python.exe -m pip install -r requirements-dev.txt
      - name: Verify release tag
        shell: pwsh
        run: |
          $version = (.venv\Scripts\python.exe -c 'from app_info import VERSION; print(VERSION)').Trim()
          if ($env:GITHUB_REF_NAME -ne "v$version") { throw "Tag and app version do not match" }
      - name: Check and package
        shell: pwsh
        run: ./scripts/build.ps1
      - name: Publish prerelease
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$env:GITHUB_REF_NAME" release/*.zip release/SHA256SUMS.txt --prerelease --title "TrainerRelay $env:GITHUB_REF_NAME" --notes-file CHANGELOG.md --verify-tag
