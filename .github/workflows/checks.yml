name: Checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          architecture: x64
          cache: pip
      - run: python -m venv .venv
      - run: .venv\Scripts\python.exe -m pip install -r requirements-dev.txt
      - name: Check and build release bundle
        shell: pwsh
        run: ./scripts/build.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: TrainerRelay-windows-x64
          path: |
            release/*.zip
            release/SHA256SUMS.txt
